name: Build DTXManiaNX

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore DTXMania.sln

      - name: Build (Release, x86)
        run: msbuild DTXMania.sln /m /p:Configuration=Release /p:Platform=x86 /verbosity:minimal

      - name: Package runtime
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF.Substring(11) } else { 'dev-' + $env:GITHUB_SHA.Substring(0, 7) }
          # Create the destination first: Copy-Item into a missing folder flattens the first
          # directory it copies (dll\ landed at the root of the first zip).
          New-Item -ItemType Directory -Force -Path dist\DTXManiaNX | Out-Null
          # Ship everything the game needs; leave Config.ini out so an upgrade keeps user settings
          Get-ChildItem Runtime -Force | Where-Object { $_.Name -ne 'Config.ini' } | Copy-Item -Destination dist\DTXManiaNX -Recurse -Force
          # This is an x86 build: the exe loads native BASS DLLs from dll\, so put the 32-bit set there
          Copy-Item dist\DTXManiaNX\dll\32-bit\* dist\DTXManiaNX\dll\ -Force
          Remove-Item dist\DTXManiaNX\dll\32-bit, dist\DTXManiaNX\dll\64-bit -Recurse -Force
          Get-ChildItem dist\DTXManiaNX | Select-Object Name | Out-String | Write-Host
          Get-ChildItem dist\DTXManiaNX\dll | Select-Object Name | Out-String | Write-Host
          Compress-Archive -Path dist\DTXManiaNX\* -DestinationPath "dist\DTXManiaNX-$ver.zip" -Force
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DTXManiaNX-${{ env.VERSION }}
          path: dist/*.zip

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true

  # Launches the freshly built game on the runner, in compact mode with everything on auto-play
  # and the drums notation view on, and photographs it. Purely diagnostic: it runs after `build`
  # (so it cannot delay or break the release step) and `continue-on-error` keeps a broken smoke
  # test from failing the workflow.
  smoke:
    name: Smoke test (auto-play screenshots)
    needs: build
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download the built runtime
        uses: actions/download-artifact@v4
        with:
          pattern: DTXManiaNX-*
          merge-multiple: true
          path: dist

      - name: Unpack the runtime
        shell: pwsh
        run: |
          $zip = (Get-ChildItem dist\*.zip | Select-Object -First 1).FullName
          Write-Host "Unpacking $zip"
          Expand-Archive -Path $zip -DestinationPath game -Force
          Get-ChildItem game | Select-Object Name, Length | Format-Table | Out-String | Write-Host

      - name: Probe the runner (display, audio, DirectX)
        shell: powershell
        continue-on-error: true
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Write-Host "=== Session ==="
          Write-Host ("SessionId       : {0}" -f (Get-Process -Id $PID).SessionId)
          Write-Host ("UserInteractive : {0}" -f [Environment]::UserInteractive)
          Write-Host "=== Display ==="
          Write-Host ("VirtualScreen   : {0}" -f [System.Windows.Forms.SystemInformation]::VirtualScreen)
          [System.Windows.Forms.Screen]::AllScreens | ForEach-Object { Write-Host ("Screen          : {0} {1}" -f $_.DeviceName, $_.Bounds) }
          Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion, VideoModeDescription | Format-List | Out-String | Write-Host
          Write-Host "=== Audio ==="
          # This image has both services running but no endpoint at all, which is why the game is
          # launched with FDK_ALLOW_SILENT_SOUND_DEVICE. If a device ever shows up here, drop it.
          Get-Service audiosrv, AudioEndpointBuilder | Select-Object Name, Status, StartType | Format-Table | Out-String | Write-Host
          Get-CimInstance Win32_SoundDevice | Select-Object Name, Status | Format-Table | Out-String | Write-Host
          Get-PnpDevice -Class 'MEDIA', 'AudioEndpoint' -ErrorAction SilentlyContinue |
            Select-Object Status, Class, FriendlyName | Format-Table | Out-String | Write-Host
          Write-Host "=== DirectX DLLs in System32/SysWOW64 ==="
          foreach ($n in 'd3d9.dll', 'd3d9on12.dll', 'd3dx9_43.dll', 'd3d12.dll', 'd3d12core.dll', 'd3dref9.dll') {
            foreach ($d in "$env:WINDIR\System32", "$env:WINDIR\SysWOW64") {
              Write-Host ("{0,-16} {1,-24} {2}" -f $n, (Split-Path $d -Leaf), (Test-Path (Join-Path $d $n)))
            }
          }

      - name: Install the D3DX9 runtime (d3dx9_43.dll, x86)
        shell: pwsh
        run: |
          # DTXMania LoadLibrary()s d3dx9_43.dll at startup and refuses to boot without it; stock
          # Windows Server has the core DirectX but not the June 2010 D3DX redist.
          $tmp = $env:RUNNER_TEMP
          $exe = Join-Path $tmp 'dxredist.exe'
          $url = 'https://download.microsoft.com/download/8/4/A/84A35BF1-DAFE-4AE8-82AF-AD2AE20B6B14/directx_Jun2010_redist.exe'
          Invoke-WebRequest -Uri $url -OutFile $exe -UseBasicParsing
          $out = Join-Path $tmp 'dxcab'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Start-Process -FilePath $exe -ArgumentList "/Q", "/T:`"$out`"", "/C" -Wait -NoNewWindow
          $cab = Get-ChildItem $out -Filter '*d3dx9_43_x86.cab' | Select-Object -First 1
          if (-not $cab) { Get-ChildItem $out | Select-Object Name | Out-String | Write-Host; throw 'd3dx9_43 x86 cab not found in the redist' }
          & expand.exe $cab.FullName -F:d3dx9_43.dll (Join-Path $PWD 'game') | Write-Host
          Get-ChildItem game\d3dx9_43.dll | Format-List Name, Length | Out-String | Write-Host

      - name: Build the smoke-test song
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path song | Out-Null
          Copy-Item Tests\SmokeSong\smoke.dtx song\ -Force
          function New-SilentWav([string]$path, [double]$seconds) {
            $rate = 44100; $channels = 2; $bits = 16
            $block = $channels * $bits / 8
            $byteRate = $rate * $block
            $dataLen = [int]([math]::Floor($byteRate * $seconds / $block) * $block)
            $fs = [System.IO.File]::Create($path)
            $bw = New-Object System.IO.BinaryWriter($fs)
            $bw.Write([System.Text.Encoding]::ASCII.GetBytes('RIFF'))
            $bw.Write([uint32](36 + $dataLen))
            $bw.Write([System.Text.Encoding]::ASCII.GetBytes('WAVEfmt '))
            $bw.Write([uint32]16)                 # fmt chunk size
            $bw.Write([uint16]1)                  # PCM
            $bw.Write([uint16]$channels)
            $bw.Write([uint32]$rate)
            $bw.Write([uint32]$byteRate)
            $bw.Write([uint16]$block)
            $bw.Write([uint16]$bits)
            $bw.Write([System.Text.Encoding]::ASCII.GetBytes('data'))
            $bw.Write([uint32]$dataLen)
            $bw.Write((New-Object byte[] $dataLen))   # silence
            $bw.Close(); $fs.Close()
          }
          New-SilentWav (Join-Path $PWD 'song\bgm.wav') 70
          New-SilentWav (Join-Path $PWD 'song\tick.wav') 0.05

          # A second difficulty slot, so the song-select run has something to toggle between:
          # DTXMania only cycles difficulties when the song has more than one chart. Same chart,
          # different #DLEVEL, so the level in the high score box header differs per slot too.
          # Latin-1 round-trips every byte, so the chart's Shift_JIS bytes survive the edit.
          $enc = [System.Text.Encoding]::GetEncoding(28591)
          $dtx = $enc.GetString([System.IO.File]::ReadAllBytes((Join-Path $PWD 'song\smoke.dtx')))
          $dtx = $dtx -replace '(?m)^#DLEVEL:.*$', '#DLEVEL: 30'
          [System.IO.File]::WriteAllBytes((Join-Path $PWD 'song\smoke2.dtx'), $enc.GetBytes($dtx))
          Copy-Item Tests\SmokeSong\set.def song\ -Force

          # Seed the named high score tables. One file per chart, one section per difficulty slot,
          # and every name says which chart and which slot it came from, so a frame of the song
          # select screen proves exactly which [Drums.<slot>] section the panel resolved.
          function New-ScoresIni([string]$path, [string]$chart) {
            $lines = @('; seeded by the CI smoke job')
            foreach ($slot in 0..4) {
              $lines += ''
              $lines += "[Drums.$slot]"
              $lines += "1=$chart-S$slot-A,$(900000 - $slot * 1000),SS,9$slot.75,55.50,2026-09-12"
              $lines += "2=$chart-S$slot-B,$(750000 - $slot * 1000),S,8$slot.20,48.10,2026-09-11"
              $lines += "3=$chart-S$slot-C,$(610000 - $slot * 1000),A,7$slot.05,40.00,2026-09-10"
            }
            [System.IO.File]::WriteAllLines($path, $lines, (New-Object System.Text.UTF8Encoding $false))
          }
          New-ScoresIni (Join-Path $PWD 'song\smoke.dtx.scores.ini')  'L1'
          New-ScoresIni (Join-Path $PWD 'song\smoke2.dtx.scores.ini') 'L2'

          Get-ChildItem song | Select-Object Name, Length | Format-Table | Out-String | Write-Host
          Get-Content song\smoke.dtx.scores.ini | Select-Object -First 8 | Out-String | Write-Host

      - name: Write the smoke-test Config.ini
        shell: pwsh
        run: |
          # Plain ASCII with no BOM: CConfigIni reads Shift_JIS unless a BOM says otherwise.
          # Only the keys that matter here; everything else keeps its built-in default.
          $cfg = @(
            '; Written by the CI smoke job. Not the stock Runtime\Config.ini.',
            '[System]',
            'DTXPath=',
            'FullScreen=0',          # windowed, so the desktop capture can see it
            'WindowWidth=1024',      # the runner's desktop is only 1024x768; the back buffer
            'WindowHeight=576',      # stays 1280x720 either way, so Capture_img is full size
            'WindowX=0',
            'WindowY=0',
            'VSyncWait=0',
            'SoundDeviceType=0',     # 0 = ACM/DirectSound; FDK falls back on its own if it fails
            'Drums=1',
            'Guitar=0',
            'MovieMode=0',
            'AVI=0',
            'BGA=0',
            'TimeStretch=0',
            'PlaySpeed=20',          # 20 = 1.0x
            'BGMSound=1',
            'MasterVolume=0',
            '[Log]',
            'OutputLog=1',
            'TraceDTXDetails=1',
            'TraceSongSearch=1',
            '[PlayOption]',
            'DrumsReverse=0',
            'DrumsNotationView=1',
            'DrumsScrollSpeed=3',    # 0=x0.5, 1=x1.0, 2=x1.5 ... so 3 is the owner's SPEED 2.0
            '[AutoPlay]',
            # SD is left to the player so the frames exercise the miss path: MISS popups, the
            # combo breaking and the judgement-string lane flash all only fire on a real lane.
            'LC=1', 'HH=1', 'SD=0', 'BD=1', 'HT=1', 'LT=1',
            'FT=1', 'CY=1', 'RD=1', 'LP=1', 'LBD=1'
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD 'game\Config.ini'), $cfg, (New-Object System.Text.ASCIIEncoding))
          Get-Content game\Config.ini | Out-String | Write-Host

      - name: Launch the game and take screenshots
        shell: powershell
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Continue'
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -TypeDefinition (@(
            'using System;',
            'using System.Runtime.InteropServices;',
            'public class Win32 {',
            '  [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; }',
            '  [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);',
            '  [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);',
            '  [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);',
            '}'
          ) -join [Environment]::NewLine)
          $game = Join-Path $PWD 'game'
          $exe  = Join-Path $game 'DTXManiaNX.exe'
          $dtx  = Join-Path $PWD 'song\smoke.dtx'
          $shots = Join-Path $PWD 'screenshots'
          New-Item -ItemType Directory -Force -Path $shots | Out-Null

          # Opt-in in-game capture: the game writes its own back buffer to Capture_img every 2 s.
          # Independent of whether the runner's desktop is capturable at all - and the back buffer
          # is always 1280x720, so these are full-size even though the window is not.
          $env:DTXMANIA_AUTOCAPTURE_MS = '2000'
          # This runner has no audio endpoint at all: DirectSound fails with DSERR_NODRIVER
          # (0x88780078) and so does everything else, which used to leave FDK with a null device
          # and crash startup. Opt in to running silently instead.
          $env:FDK_ALLOW_SILENT_SOUND_DEVICE = '1'

          # Two runs: the scrolling staff and the page view, so a change to one is visible in the
          # frames of both. Each run is ~35 s, well inside this step's 5 minute timeout.
          foreach ($mode in @(1, 2)) {
            $name = if ($mode -eq 1) { 'scroll' } else { 'page' }
            $cfgPath = Join-Path $game 'Config.ini'
            (Get-Content $cfgPath) -replace '^DrumsNotationView=.*', "DrumsNotationView=$mode" |
              Set-Content $cfgPath -Encoding ASCII
            Write-Host "=== NotationView=$mode ($name) ==="
            Write-Host "Launching: $exe `"$dtx`""
            $proc = Start-Process -FilePath $exe -ArgumentList "`"$dtx`"" -WorkingDirectory $game -PassThru
            $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
            Write-Host "Desktop is $($bounds.Width)x$($bounds.Height)"

            for ($i = 1; $i -le 17; $i++) {
              Start-Sleep -Seconds 2
              $proc.Refresh()
              if ($proc.HasExited) {
                Write-Host "!! DTXManiaNX exited after $($i * 2)s with code $($proc.ExitCode)"
                break
              }
              $h = $proc.MainWindowHandle
              $desc = "no window yet"
              if ($h -ne [IntPtr]::Zero) {
                $r = New-Object Win32+RECT
                [void][Win32]::GetWindowRect($h, [ref]$r)
                $desc = "'$($proc.MainWindowTitle)' rect=($($r.L),$($r.T))-($($r.R),$($r.B)) visible=$([Win32]::IsWindowVisible($h))"
                [void][Win32]::SetForegroundWindow($h)
              }
              Write-Host ("t={0,3}s  {1}" -f ($i * 2), $desc)
              try {
                $bmp = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
                $g = [System.Drawing.Graphics]::FromImage($bmp)
                $g.CopyFromScreen($bounds.X, $bounds.Y, 0, 0, $bmp.Size)
                $g.Dispose()
                $bmp.Save((Join-Path $shots ("desktop_{0}_{1:D2}.png" -f $name, $i)), [System.Drawing.Imaging.ImageFormat]::Png)
                $bmp.Dispose()
              } catch {
                Write-Host "desktop capture failed: $_"
              }
            }

            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
            Start-Sleep -Seconds 2
            Get-Process -Name DTXManiaNX -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 1

            $raw = Join-Path $game 'Capture_img'
            $dest = Join-Path $game ("Capture_img_" + $name)
            Write-Host "=== Capture_img ($name) ==="
            $frames = @(Get-ChildItem $raw -ErrorAction SilentlyContinue)
            $frames | Select-Object Name, Length | Format-Table | Out-String | Write-Host
            # A run that never rendered still "passes" every step above, so say so loudly here.
            if ($frames.Count -lt 2) {
              throw "the $name run rendered $($frames.Count) frame(s) - see DTXManiaLog.txt in the smoke-screenshots artifact"
            }
            Write-Host "$($frames.Count) frames captured from the game's own back buffer (1280x720)."
            if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
            Move-Item $raw $dest
            Copy-Item $cfgPath (Join-Path $game ("Config_" + $name + ".ini")) -Force
            if (Test-Path (Join-Path $game 'DTXManiaLog.txt')) {
              Copy-Item (Join-Path $game 'DTXManiaLog.txt') (Join-Path $game ("DTXManiaLog_" + $name + ".txt")) -Force
            }
          }

      # Third launch, this one NOT in compact mode: the game boots to its own title screen with
      # DTXPath pointing at the smoke song folder, and is then driven with injected key presses to
      # song select and through a few difficulty changes. keybd_event is used rather than SendKeys
      # because DTXMania reads the keyboard through DirectInput, which sees driver-level input but
      # not posted window messages.
      - name: Launch at the title screen and drive to song select
        shell: powershell
        timeout-minutes: 6
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -TypeDefinition (@(
            'using System;',
            'using System.Runtime.InteropServices;',
            'public class Drive {',
            '  [DllImport("user32.dll")] public static extern void keybd_event(byte bVk, byte bScan, uint dwFlags, UIntPtr dwExtra);',
            '  [DllImport("user32.dll")] public static extern uint MapVirtualKey(uint uCode, uint uMapType);',
            '  [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);',
            '  public static void Tap(byte vk, int holdMs) {',
            '    byte sc = (byte)MapVirtualKey(vk, 0);',
            '    keybd_event(vk, sc, 0, UIntPtr.Zero);',
            '    System.Threading.Thread.Sleep(holdMs);',
            '    keybd_event(vk, sc, 2, UIntPtr.Zero);   // 2 = KEYEVENTF_KEYUP',
            '  }',
            '}'
          ) -join [Environment]::NewLine)

          $game    = Join-Path $PWD 'game'
          $exe     = Join-Path $game 'DTXManiaNX.exe'
          $songDir = Join-Path $PWD 'song'
          $logPath = Join-Path $game 'DTXManiaLog.txt'
          $shots   = Join-Path $PWD 'screenshots'
          New-Item -ItemType Directory -Force -Path $shots | Out-Null

          # The game holds the log open, so read it with a share-everything handle.
          function Read-GameLog([string]$path) {
            if (-not (Test-Path $path)) { return '' }
            try {
              $fs = [System.IO.File]::Open($path, 'Open', 'Read', 'ReadWrite')
              $sr = New-Object System.IO.StreamReader($fs)
              $t = $sr.ReadToEnd(); $sr.Close(); $fs.Close(); return $t
            } catch { return '' }
          }

          $cfg = @(
            '; Written by the CI smoke job (song select run).',
            '[System]',
            "DTXPath=$songDir",
            'FullScreen=0',
            'WindowWidth=1024',
            'WindowHeight=576',
            'WindowX=0',
            'WindowY=0',
            'VSyncWait=0',
            'SoundDeviceType=0',
            'Drums=1',
            'Guitar=0',
            'MovieMode=0',
            'AVI=0',
            'BGA=0',
            'BGMSound=1',
            'MasterVolume=0',
            '[Log]',
            'OutputLog=1',
            'TraceSongSearch=1'
          )
          $cfgPath = Join-Path $game 'Config.ini'
          [System.IO.File]::WriteAllLines($cfgPath, $cfg, (New-Object System.Text.ASCIIEncoding))
          Get-Content $cfgPath | Out-String | Write-Host

          # 1 s between frames: the whole point of this run is to catch the box changing.
          $env:DTXMANIA_AUTOCAPTURE_MS = '1000'
          $env:FDK_ALLOW_SILENT_SOUND_DEVICE = '1'

          $VK_RETURN = 0x0D
          $VK_X      = 0x58      # default DrumsKeyAssign HH=K033 -> SlimDX Key 33 -> X

          Write-Host "Launching (no compact mode): $exe   DTXPath=$songDir"
          $proc = Start-Process -FilePath $exe -WorkingDirectory $game -PassThru
          $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen

          function Focus-Game {
            $h = $proc.MainWindowHandle
            if ($h -ne [IntPtr]::Zero) { [void][Drive]::SetForegroundWindow($h) }
            return $h
          }
          function Snap([string]$tag) {
            try {
              $bmp = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($bounds.X, $bounds.Y, 0, 0, $bmp.Size)
              $g.Dispose()
              $bmp.Save((Join-Path $shots ("desktop_select_{0}.png" -f $tag)), [System.Drawing.Imaging.ImageFormat]::Png)
              $bmp.Dispose()
            } catch { Write-Host "desktop capture failed: $_" }
          }

          # Wait for the title screen, then press Enter (cursor starts on GAME START).
          $reachedSelect = $false
          for ($t = 1; $t -le 20; $t++) {
            Start-Sleep -Seconds 1
            $proc.Refresh()
            if ($proc.HasExited) { Write-Host "!! exited after ${t}s code $($proc.ExitCode)"; break }
            $log = Read-GameLog $logPath
            if ($log -match 'SongSelection') { $reachedSelect = $true; Write-Host "t=${t}s song select reached"; break }
            if ($log -match 'Title') {
              [void](Focus-Game)
              Write-Host "t=${t}s title screen - pressing ENTER"
              [Drive]::Tap([byte]$VK_RETURN, 80)
              Start-Sleep -Milliseconds 800
            }
          }
          Snap 'after_enter'

          if (-not $proc.HasExited) {
            # Let the list settle and the first frames of song select land.
            for ($t = 1; $t -le 6; $t++) { [void](Focus-Game); Start-Sleep -Seconds 1 }
            Snap 'select'

            # HH x2 within 500 ms is the difficulty toggle in song select (CStageSongSelection,
            # "HHx2: 難易度変更"). Four toggles, with a pause after each so several captured
            # frames show each difficulty.
            for ($i = 1; $i -le 4; $i++) {
              [void](Focus-Game)
              Write-Host "difficulty toggle $i (X, X)"
              [Drive]::Tap([byte]$VK_X, 60)
              Start-Sleep -Milliseconds 140
              [Drive]::Tap([byte]$VK_X, 60)
              for ($t = 1; $t -le 4; $t++) { [void](Focus-Game); Start-Sleep -Seconds 1 }
              Snap ("toggle{0}" -f $i)
            }
          }

          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          Start-Sleep -Seconds 2
          Get-Process -Name DTXManiaNX -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 1

          $raw  = Join-Path $game 'Capture_img'
          $dest = Join-Path $game 'Capture_img_select'
          $frames = @(Get-ChildItem $raw -ErrorAction SilentlyContinue)
          Write-Host "=== Capture_img (select): $($frames.Count) frames, song select reached: $reachedSelect ==="
          $frames | Select-Object Name, Length | Format-Table | Out-String | Write-Host
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          if (Test-Path $raw) { Move-Item $raw $dest }
          Copy-Item $cfgPath (Join-Path $game 'Config_select.ini') -Force
          if (Test-Path $logPath) { Copy-Item $logPath (Join-Path $game 'DTXManiaLog_select.txt') -Force }
          if ($frames.Count -lt 2) {
            throw "the song-select run rendered $($frames.Count) frame(s) - see DTXManiaLog_select.txt"
          }

      - name: Show DTXManiaLog.txt
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          $log = Join-Path $PWD 'game\DTXManiaLog.txt'
          if (Test-Path $log) { Get-Content $log | Out-String | Write-Host } else { Write-Host 'no DTXManiaLog.txt' }

      - name: Upload smoke test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          if-no-files-found: warn
          path: |
            screenshots/**
            game/Capture_img*/**
            game/DTXManiaLog*.txt
            game/Config*.ini
            song/*.dtx
            song/set.def
            song/*.scores.ini
